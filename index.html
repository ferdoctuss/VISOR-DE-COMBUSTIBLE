<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#0F2742" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0A1626" media="(prefers-color-scheme: dark)">
    <title>Control de Combustible - Grupo Bautista</title>

    <!-- ICONOS Y CONFIGURACIÓN PARA IPHONE -->
    <link rel="apple-touch-icon" href="icono.png">
    <link rel="icon" href="icono.png" type="image/png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Combustible CVB">

    <style>
        :root {
            --chipuluc-color: #2E7D32;
            --olmos-color: #0277BD;
            --otros-color: #B45309;
            --active-color: var(--chipuluc-color);
            --active-light: rgba(46, 125, 50, 0.16);

            --navy: #0F2742;
            --ink: #1B2733;
            --muted: #5F6B7A;
            --bg: #EEF1F5;
            --surface: #FFFFFF;
            --surface-2: #F5F7FA;
            --line: #D8DEE6;
            --radius: 8px;
            --shadow: 0 1px 2px rgba(15, 39, 66, .06);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --chipuluc-color: #4CAF50;
                --olmos-color: #29A3E8;
                --otros-color: #E08A1E;
                --navy: #0A1626;
                --ink: #E6EBF1;
                --muted: #93A0B0;
                --bg: #0B1118;
                --surface: #141C26;
                --surface-2: #19222E;
                --line: #263241;
                --shadow: none;
            }
        }

        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0; padding: 0 0 calc(24px + env(safe-area-inset-bottom, 0px));
            background: var(--bg); color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
        }
        button { font-family: inherit; }
        :focus-visible { outline: 2px solid var(--active-color); outline-offset: 2px; }

        /* === CABECERA FIJA HASTA LA FILA DE LOTE === */
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--bg);
            box-shadow: 0 4px 12px rgba(15, 39, 66, 0.08);
        }

        /* === BARRA SUPERIOR CORPORATIVA === */
        .topbar {
            background: var(--navy); color: #fff;
            padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 0;
        }
        .inner { max-width: 1000px; margin: 0 auto; }
        .title-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .brand img {
            width: 48px; height: 48px; object-fit: contain; padding: 3px;
            background: #fff; border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
            flex-shrink: 0;
        }
        h1 {
            margin: 0; font-size: 1.32rem; font-weight: 800;
            letter-spacing: 0.02em; line-height: 1.1; color: #FFFFFF;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        .subtitle {
            display: block; margin-top: 3px; font-size: .84rem;
            color: rgba(255, 255, 255, .92); font-weight: 500;
            letter-spacing: 0.01em;
        }

        .icon-btn {
            flex-shrink: 0; width: 40px; height: 40px; border-radius: 8px;
            display: inline-flex; align-items: center; justify-content: center;
            background: var(--surface); color: var(--muted);
            border: 1px solid var(--line); cursor: pointer;
            transition: color .15s, border-color .15s;
        }
        .icon-btn:hover, .icon-btn:active { color: var(--active-color); border-color: var(--active-color); }
        .icon-btn svg { width: 18px; height: 18px; }
        .icon-btn.spin svg { animation: spin .8s linear infinite; }
        .icon-btn.on-dark { background: rgba(255,255,255,0.08); color: #fff; border-color: rgba(255,255,255,.32); }
        .icon-btn.on-dark:hover { color: #fff; border-color: #fff; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Proyectos como navegación principal */
        .segmented { display: flex; margin-top: 12px; }
        .project-btn {
            flex: 1; padding: 11px 6px 9px; border: 0; background: transparent; cursor: pointer;
            color: rgba(255,255,255,.7); font-size: .95rem; font-weight: 600;
            border-bottom: 3px solid transparent;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: color .15s, border-color .15s;
        }
        .project-btn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dot); }
        #btn-chipuluc { --dot: #66BB6A; }
        #btn-olmos { --dot: #4FC3F7; }
        #btn-otros { --dot: #FBBF24; }
        .project-btn:hover { color: #fff; }
        .project-btn.active { color: #fff; font-weight: 700; border-bottom-color: #fff; }

        /* Contenedor fijo para las métricas */
        .metrics-wrapper {
            max-width: 1000px;
            margin: 0 auto;
            padding: 10px 16px;
        }

        /* Indicadores */
        .metrics-container {
            display: grid; grid-template-columns: 1fr 1fr 1.2fr;
            background: var(--surface); border: 1px solid var(--line);
            border-top: 3px solid var(--active-color); border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .metric-block { padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .metric-block + .metric-block { border-left: 1px solid var(--line); }
        .metric-title { font-size: .76rem; font-weight: 600; color: var(--muted); }
        .metric-value { font-size: 1.35rem; font-weight: 700; line-height: 1.05; overflow-wrap: anywhere; }
        .metric-block.stock .metric-value { color: var(--active-color); font-size: 1.55rem; }

        /* === CONTENIDO DESPLAZABLE === */
        .app { width: 100%; max-width: 1000px; margin: 0 auto; padding: 6px 16px 0; }

        /* Pestañas */
        .tabs-container { display: flex; gap: 20px; border-bottom: 1px solid var(--line); }
        .tab-btn {
            padding: 10px 2px; border: 0; background: none; cursor: pointer;
            color: var(--muted); font-size: .92rem; font-weight: 600;
            border-bottom: 3px solid transparent; margin-bottom: -1px;
        }
        .tab-btn.active { color: var(--ink); border-bottom-color: var(--active-color); }

        /* Búsqueda */
        .toolbar {
            display: flex; gap: 8px; align-items: center; padding: 10px 0 6px;
        }
        .search-container { position: relative; flex: 1; }
        .search-input {
            width: 100%; height: 40px; padding: 0 38px; font-size: 16px; font-family: inherit;
            color: var(--ink); background: var(--surface);
            border: 1px solid var(--line); border-radius: 6px; outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        .search-input::placeholder { color: var(--muted); opacity: .85; }
        .search-input:focus { border-color: var(--active-color); box-shadow: 0 0 0 3px var(--active-light); }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
        .clear-search { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; padding: 7px; color: var(--muted); cursor: pointer; display: none; }
        .clear-search:hover { color: var(--ink); }
        .count { margin: 2px 0 8px; font-size: .8rem; color: var(--muted); min-height: 1.1em; }

        /* Tabla */
        table {
            width: 100%; border-collapse: separate; border-spacing: 0;
            background: var(--surface); border: 1px solid var(--line);
            border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
        }
        th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); font-size: .9rem; }
        th { background: var(--surface-2); color: var(--muted); font-size: .78rem; font-weight: 700; white-space: nowrap; border-bottom: 2px solid var(--line); }
        tbody tr:nth-child(even) td { background: var(--surface-2); }
        tbody tr:hover td { background: var(--active-light); }
        tbody tr:last-child td { border-bottom: 0; }

        .loading { color: var(--muted); text-align: center; }
        .msg { padding: 24px 14px; line-height: 1.45; }
        .msg.error { color: #C62828; }
        .sk { height: 52px; border-radius: 6px; background: linear-gradient(90deg, var(--line) 25%, var(--surface-2) 50%, var(--line) 75%); background-size: 200% 100%; animation: shimmer 1.3s infinite; }
        @keyframes shimmer { to { background-position: -200% 0; } }

        /* === MÓVIL: FICHAS COMPACTAS === */
        @media (max-width: 768px) {
            .metrics-wrapper { padding: 8px 12px; }
            .app { padding: 4px 12px 0; }
            table { background: transparent; border: 0; box-shadow: none; border-radius: 0; overflow: visible; }
            table, thead, tbody, tr, td { display: block; width: 100%; }
            thead { display: none; }
            tbody tr {
                display: grid; grid-template-columns: 1fr 1fr; gap: 7px 10px;
                margin-bottom: 8px; padding: 10px 12px;
                background: var(--surface); border: 1px solid var(--line);
                border-left: 3px solid var(--active-color);
                border-radius: var(--radius); box-shadow: var(--shadow);
            }
            tbody tr:nth-child(even) td, tbody tr:hover td { background: none; }
            td { padding: 0; border: 0; min-width: 0; overflow-wrap: anywhere; font-size: .86rem; font-weight: 600; line-height: 1.25; }
            td::before {
                content: attr(data-label); display: block; margin-bottom: 1px;
                font-size: .68rem; font-weight: 600; color: var(--muted);
                text-transform: uppercase; letter-spacing: 0.02em;
            }
            td:first-child {
                grid-column: 1 / -1; font-size: .92rem; font-weight: 700;
                padding-bottom: 6px; margin-bottom: 1px; border-bottom: 1px solid var(--line);
            }
            /* Oculta observaciones vacías en móvil para ahorrar espacio vertical */
            td.empty-obs { display: none; }
            td.loading { grid-column: 1 / -1; font-weight: 500; }
            td.loading::before { content: none; }
            .metric-block { padding: 8px 8px; }
            .metric-value { font-size: 1.15rem; }
            .metric-block.stock .metric-value { font-size: 1.38rem; }
            .tabs-container { gap: 14px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>

<div class="sticky-header">
    <div class="topbar">
        <div class="inner">
            <div class="title-bar">
                <div class="brand">
                    <img src="icono4.png" alt="Logo Grupo Bautista">
                    <div>
                        <h1>Grupo Bautista</h1>
                        <span class="subtitle">Control de combustible</span>
                    </div>
                </div>
                <button class="icon-btn on-dark" onclick="location.reload()" aria-label="Recargar la app" title="Recargar la app">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                    </svg>
                </button>
            </div>
            <nav class="segmented" aria-label="Proyecto">
                <button id="btn-chipuluc" class="project-btn active" onclick="cambiarProyecto('Chipuluc')">Chipuluc</button>
                <button id="btn-olmos" class="project-btn" onclick="cambiarProyecto('Olmos')">Olmos</button>
                <button id="btn-otros" class="project-btn" onclick="cambiarProyecto('Otros')">Otros</button>
            </nav>
        </div>
    </div>

    <div id="metrics-wrapper" class="metrics-wrapper">
        <div id="metrics-panel" class="metrics-container">
            <div class="metric-block">
                <span class="metric-title">Lote</span>
                <span id="lote-value" class="metric-value">...</span>
            </div>
            <div class="metric-block">
                <span class="metric-title">G. recargados</span>
                <span id="recargados-value" class="metric-value">...</span>
            </div>
            <div class="metric-block stock">
                <span class="metric-title">Stock</span>
                <span id="stock-value" class="metric-value">...</span>
            </div>
        </div>
    </div>
</div>

<div class="app">
    <div id="tabs-panel" class="tabs-container" role="tablist">
        <button id="btn-registros" class="tab-btn active" onclick="cambiarPestana('registros')">Registro de consumo</button>
        <button id="btn-ingresos" class="tab-btn" onclick="cambiarPestana('ingresos')">Ingresos de combustible</button>
    </div>

    <!-- BÚSQUEDA + ACTUALIZAR -->
    <div class="toolbar">
        <div class="search-container">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="search" id="searchInput" class="search-input" oninput="filtrarTabla()" placeholder="Buscar unidad, placa, operador..." aria-label="Buscar">
            <svg class="clear-search" id="clearSearchBtn" onclick="limpiarBusqueda()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Borrar búsqueda">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </div>
        <button id="sync-btn" class="icon-btn" onclick="cargarDatos()" aria-label="Actualizar datos" title="Actualizar datos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 0 0-15-6.7L3 8"></path>
                <polyline points="3 3 3 8 8 8"></polyline>
                <path d="M3 12a9 9 0 0 0 15 6.7L21 16"></path>
                <polyline points="21 21 21 16 16 16"></polyline>
            </svg>
        </button>
    </div>
    <div id="count" class="count" aria-live="polite"></div>

    <div class="table-container">
        <table>
            <thead id="table-head"></thead>
            <tbody id="table-body">
                <tr><td colspan="10" class="loading"><div class="sk"></div></td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const sheetId = '1Ep5r38QoJSugFPRdhXCo8JCy4dRZuJSzsCb_qbK37eg';

    // GIDs para Chipuluc
    const gidStockChipuluc = '252157837';
    const gidExtraChipuluc = '1813245410';

    // GIDs para Olmos
    const gidStockOlmos = '391952692';
    const gidExtraOlmos = '562959693';

    // GIDs de tablas principales
    const gidRegistros = '481287721';
    const gidIngresos = '690045193';

    let proyectoActivo = 'Chipuluc';
    let pestanaActiva = 'registros';

    const colores = {
        Chipuluc: ['var(--chipuluc-color)', 'rgba(46, 125, 50, 0.14)'],
        Olmos:    ['var(--olmos-color)',    'rgba(2, 119, 189, 0.14)'],
        Otros:    ['var(--otros-color)',    'rgba(180, 83, 9, 0.14)']
    };

    function actualizarInterfazPorProyecto() {
        const root = document.documentElement;
        const metricsWrapper = document.getElementById('metrics-wrapper');
        const btnIngresos = document.getElementById('btn-ingresos');

        root.style.setProperty('--active-color', colores[proyectoActivo][0]);
        root.style.setProperty('--active-light', colores[proyectoActivo][1]);

        if (proyectoActivo === 'Otros') {
            metricsWrapper.style.display = 'none';
            btnIngresos.style.display = 'none';
            pestanaActiva = 'registros';
            document.getElementById('btn-registros').classList.add('active');
            document.getElementById('btn-ingresos').classList.remove('active');
        } else {
            metricsWrapper.style.display = 'block';
            btnIngresos.style.display = 'block';
        }
    }

    function cambiarProyecto(proyecto) {
        if (proyectoActivo === proyecto) return;
        proyectoActivo = proyecto;

        ['Chipuluc', 'Olmos', 'Otros'].forEach(p => {
            document.getElementById('btn-' + p.toLowerCase()).classList.toggle('active', p === proyecto);
        });

        actualizarInterfazPorProyecto();
        cargarDatos();
    }

    function cambiarPestana(pestana) {
        if (pestanaActiva === pestana) return;
        pestanaActiva = pestana;
        document.getElementById('btn-registros').classList.toggle('active', pestana === 'registros');
        document.getElementById('btn-ingresos').classList.toggle('active', pestana === 'ingresos');
        cargarDatos();
    }

    function limpiarBusqueda() {
        const input = document.getElementById('searchInput');
        input.value = '';
        filtrarTabla();
        input.focus();
    }

    function actualizarConteo() {
        const filas = Array.from(document.getElementById('table-body').getElementsByTagName('tr'))
            .filter(tr => !tr.querySelector('.loading') && tr.style.display !== 'none');
        const buscando = document.getElementById('searchInput').value.length > 0;
        let texto = filas.length + (filas.length === 1 ? ' registro' : ' registros');
        if (buscando && filas.length === 0) texto = 'Sin resultados. Prueba con otra unidad, placa u operador.';
        document.getElementById('count').innerText = texto;
    }

    function filtrarTabla() {
        const input = document.getElementById('searchInput');
        const filtro = input.value.toLowerCase();
        const filas = document.getElementById('table-body').getElementsByTagName('tr');
        document.getElementById('clearSearchBtn').style.display = filtro.length > 0 ? 'block' : 'none';

        for (let i = 0; i < filas.length; i++) {
            if (filas[i].querySelector('.loading')) continue;
            const textoFila = filas[i].textContent || filas[i].innerText;
            filas[i].style.display = textoFila.toLowerCase().indexOf(filtro) > -1 ? "" : "none";
        }
        actualizarConteo();
    }

    function mostrarMensaje(tbody, texto, esError) {
        tbody.innerHTML = '';
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 10;
        td.className = 'loading msg' + (esError ? ' error' : '');
        td.innerText = texto;
        tr.appendChild(td);
        tbody.appendChild(tr);
    }

    function mostrarEsqueleto(tbody) {
        tbody.innerHTML = '';
        for (let i = 0; i < 4; i++) {
            const tr = document.createElement('tr');
            tr.innerHTML = '<td colspan="10" class="loading" style="padding:8px 0"><div class="sk"></div></td>';
            tbody.appendChild(tr);
        }
    }

    function valorCelda(cell) {
        if (cell && cell.f) return cell.f;
        if (cell && cell.v !== null && cell.v !== undefined && cell.v !== '') return cell.v;
        return '-';
    }

    async function cargarDatos() {
        actualizarInterfazPorProyecto();

        const tbody = document.getElementById('table-body');
        const thead = document.getElementById('table-head');
        const inputBusqueda = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearSearchBtn');
        const syncBtn = document.getElementById('sync-btn');
        const countEl = document.getElementById('count');

        const stockValueEl = document.getElementById('stock-value');
        const loteValueEl = document.getElementById('lote-value');
        const recargadosValueEl = document.getElementById('recargados-value');

        syncBtn.classList.add('spin');
        countEl.innerText = 'Sincronizando...';
        mostrarEsqueleto(tbody);
        inputBusqueda.value = "";
        clearBtn.style.display = 'none';

        const noCache = new Date().getTime();

        // Métricas superiores solo para Chipuluc y Olmos
        if (proyectoActivo === 'Chipuluc' || proyectoActivo === 'Olmos') {
            stockValueEl.innerText = '...';
            loteValueEl.innerText = '...';
            recargadosValueEl.innerText = '...';

            const gidStockActual = (proyectoActivo === 'Chipuluc') ? gidStockChipuluc : gidStockOlmos;
            const urlStock = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&gid=${gidStockActual}&range=A1:A2&headers=1&_=${noCache}`;

            try {
                const responseStock = await fetch(urlStock);
                const textStock = await responseStock.text();
                const jsonStringStock = textStock.substring(textStock.indexOf('({') + 1, textStock.lastIndexOf('})') + 1);
                const dataStock = JSON.parse(jsonStringStock);

                let stockCell = dataStock.table.rows[0].c[0];
                let stockText = (stockCell && stockCell.f) ? stockCell.f : (stockCell && stockCell.v ? stockCell.v : '0');
                stockValueEl.innerText = stockText;
            } catch (error) {
                stockValueEl.innerText = 'Error';
            }

            if (proyectoActivo === 'Chipuluc') {
                const urlExtraChipuluc = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&gid=${gidExtraChipuluc}&range=A1:B2&headers=1&_=${noCache}`;
                try {
                    const responseExtra = await fetch(urlExtraChipuluc);
                    const textExtra = await responseExtra.text();
                    const jsonStringExtra = textExtra.substring(textExtra.indexOf('({') + 1, textExtra.lastIndexOf('})') + 1);
                    const dataExtra = JSON.parse(jsonStringExtra);

                    let columnasData = dataExtra.table.rows[0].c;
                    let loteCell = columnasData[0];
                    loteValueEl.innerText = (loteCell && loteCell.f) ? loteCell.f : (loteCell && loteCell.v ? loteCell.v : '-');

                    let recargadosCell = columnasData.length > 1 ? columnasData[1] : null;
                    recargadosValueEl.innerText = (recargadosCell && recargadosCell.f) ? recargadosCell.f : (recargadosCell && recargadosCell.v ? recargadosCell.v : '-');
                } catch (error) {
                    loteValueEl.innerText = 'Error';
                    recargadosValueEl.innerText = 'Error';
                }
            } else if (proyectoActivo === 'Olmos') {
                const urlExtraOlmos = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&gid=${gidExtraOlmos}&headers=1&_=${noCache}`;
                try {
                    const responseExtra = await fetch(urlExtraOlmos);
                    const textExtra = await responseExtra.text();
                    const jsonStringExtra = textExtra.substring(textExtra.indexOf('({') + 1, textExtra.lastIndexOf('})') + 1);
                    const dataExtra = JSON.parse(jsonStringExtra);

                    let filasValidas = dataExtra.table.rows.filter(r => r.c && r.c.some(celda => celda && celda.v !== null && String(celda.v).trim() !== ''));

                    // N de Lote = cantidad de filas llenas desde la fila 2
                    loteValueEl.innerText = filasValidas.length;

                    // G. Recargados = Columna D de la última fila llena
                    if (filasValidas.length > 0) {
                        let ultimaFila = filasValidas[filasValidas.length - 1];
                        let cellColumnaD = ultimaFila.c[3];
                        recargadosValueEl.innerText = (cellColumnaD && cellColumnaD.f) ? cellColumnaD.f : (cellColumnaD && cellColumnaD.v !== null ? cellColumnaD.v : '0');
                    } else {
                        recargadosValueEl.innerText = '0';
                    }
                } catch (error) {
                    loteValueEl.innerText = 'Error';
                    recargadosValueEl.innerText = 'Error';
                }
            }
        }

        // Tabla principal
        const gidActual = (pestanaActiva === 'registros' || proyectoActivo === 'Otros') ? gidRegistros : gidIngresos;
        const urlTabla = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&gid=${gidActual}&_=${noCache}`;

        try {
            const response = await fetch(urlTabla);
            const text = await response.text();
            const jsonString = text.substring(text.indexOf('({') + 1, text.lastIndexOf('})') + 1);
            const data = JSON.parse(jsonString);

            thead.innerHTML = '';
            tbody.innerHTML = '';

            const headers = data.table.cols;
            let trHead = document.createElement('tr');
            headers.forEach(header => {
                if (header.label) {
                    let th = document.createElement('th');
                    th.innerText = header.label;
                    trHead.appendChild(th);
                }
            });
            thead.appendChild(trHead);

            // Columna B (índice 1) para 'registros' | Columna C (índice 2) para 'ingresos'
            let indiceColumnaFiltro = (pestanaActiva === 'registros' || proyectoActivo === 'Otros') ? 1 : 2;

            let rows = data.table.rows.reverse();
            rows = rows.filter(row => {
                let cell = row.c[indiceColumnaFiltro];
                let valor = (cell && cell.v) ? String(cell.v).trim() : '';
                return valor.toLowerCase() === proyectoActivo.toLowerCase();
            });

            if (rows.length === 0) {
                mostrarMensaje(tbody, `Aún no hay registros para ${proyectoActivo}. Cuando se anoten en la hoja, aparecerán aquí.`, false);
                countEl.innerText = '0 registros';
                return;
            }

            rows.forEach(row => {
                let tr = document.createElement('tr');
                row.c.forEach((cell, index) => {
                    if (index < headers.length && headers[index].label) {
                        let td = document.createElement('td');
                        let label = headers[index].label;
                        let val = valorCelda(cell);
                        td.setAttribute('data-label', label);
                        td.innerText = val;
                        if (val === '-' && label.toUpperCase().includes('OBSERV')) {
                            td.classList.add('empty-obs');
                        }
                        tr.appendChild(td);
                    }
                });
                tbody.appendChild(tr);
            });
            actualizarConteo();

        } catch (error) {
            mostrarMensaje(tbody, 'No se pudo conectar con la hoja. Revisa tu internet y toca el botón de actualizar.', true);
            countEl.innerText = '';
        } finally {
            syncBtn.classList.remove('spin');
        }
    }

    window.onload = cargarDatos;
</script>
</body>
</html>
